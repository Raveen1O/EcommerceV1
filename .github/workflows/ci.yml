name: CI Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [
          'cart_service',
          'order_service',
          'payment_service',
          'product_service',
          'Inventory_service',
          'Notification_service'
        ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Using Node 24 for the native node:test runner

      - name: Install Dependencies
        working-directory: ./microservices/${{ matrix.service }}
        run: npm install

      - name: Run Tests
        working-directory: ./microservices/${{ matrix.service }}
        run: node --experimental-test-coverage --test

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Snyk and jq
        run: |
          npm install -g snyk
          sudo apt-get install -y jq

      - name: Run Snyk Security Score Check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth $SNYK_TOKEN
          # Print the detailed human-readable output first (dependencies)
          snyk test --all-projects || true
          # Scan microservices source code (SAST)
          snyk code test || true
          
          # Generate JSON for the score calculation
          snyk test --all-projects --json > snyk-report.json || true
          
          CRITICAL=$(cat snyk-report.json | jq '[.[]? | select(.vulnerabilities != null) | .vulnerabilities[]? | select(.severity == "critical")] | length')
          HIGH=$(cat snyk-report.json | jq '[.[]? | select(.vulnerabilities != null) | .vulnerabilities[]? | select(.severity == "high")] | length')
          MEDIUM=$(cat snyk-report.json | jq '[.[]? | select(.vulnerabilities != null) | .vulnerabilities[]? | select(.severity == "medium")] | length')
          LOW=$(cat snyk-report.json | jq '[.[]? | select(.vulnerabilities != null) | .vulnerabilities[]? | select(.severity == "low")] | length')
          
          # Default to 0 if jq fails or returns empty
          CRITICAL=${CRITICAL:-0}
          HIGH=${HIGH:-0}
          MEDIUM=${MEDIUM:-0}
          LOW=${LOW:-0}
          
          echo "Vulnerabilities found: Critical=$CRITICAL, High=$HIGH, Medium=$MEDIUM, Low=$LOW"
          
          SCORE=$((100 - (CRITICAL * 10) - (HIGH * 0) - (MEDIUM * 0) - (LOW * 0)))
          
          echo "Calculated Security Score: $SCORE%"
          
          if [ "$SCORE" -le 60 ]; then
            echo "Security score is below or equal to 60%. Failing the build."
            exit 1
          else
            echo "Security test is a success! Score is greater than 60%."
          fi

  deploy:
    needs: [test, security]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: cart_service
            function_name: raveen-cart_service_v2
          - service: order_service
            function_name: raveen-order_service_v2
          - service: payment_service
            function_name: raveen-payment_service_v2
          - service: product_service
            function_name: raveen-product_service_v2
          - service: Inventory_service
            function_name: Inventory_consumer-raveen_v2
          - service: Notification_service
            function_name: email-consumer-raveen_v2
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        working-directory: ./microservices/${{ matrix.service }}
        run: npm install

      - name: Zip Microservice
        working-directory: ./microservices/${{ matrix.service }}
        run: zip -r ../${{ matrix.service }}.zip .

      - name: Deploy to AWS Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ matrix.function_name }} \
            --zip-file fileb://microservices/${{ matrix.service }}.zip
