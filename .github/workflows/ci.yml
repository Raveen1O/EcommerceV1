name: CI Tests

on:
  push:
    branches:
      - main
      - master
      - traces
  pull_request:
    branches:
      - main
      - master
      - traces

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        id: detect
        run: |
          SERVICES="[\"none\"]"
          FRONTEND="false"
          
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD || git ls-files)
          fi
          
          if echo "$CHANGED_FILES" | grep -q "^frontend/"; then
            FRONTEND="true"
          fi
          
          CHANGED_SERVICES=$(echo "$CHANGED_FILES" | grep "^microservices/" | cut -d'/' -f2 | sort -u)
          
          if [ -n "$CHANGED_SERVICES" ]; then
            SERVICES=$(echo "$CHANGED_SERVICES" | jq -R -s -c 'split("\n")[:-1]')
          fi
          
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT

  build:
    needs: changes
    if: ${{ needs.changes.outputs.services != '["none"]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Dependencies
        working-directory: ./microservices/${{ matrix.service }}
        run: npm install

  unit_test:
    needs: [changes, build]
    if: |
      always() && 
      needs.changes.outputs.services != '["none"]' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Dependencies
        working-directory: ./microservices/${{ matrix.service }}
        run: npm install
      - name: Run Tests
        working-directory: ./microservices/${{ matrix.service }}
        run: node --experimental-test-coverage --test

  sast_scan:
    needs: [changes, unit_test]
    if: |
      always() && 
      needs.changes.outputs.services != '["none"]' &&
      (needs.unit_test.result == 'success' || needs.unit_test.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Snyk CLI
        run: npm install -g snyk
      - name: Run Snyk SAST
        working-directory: ./microservices/${{ matrix.service }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test --json > snyk-sast.json || true
          node ../../scripts/snyk-score.js snyk-sast.json

  sast_scan_frontend:
    needs: [changes]
    if: |
      always() && 
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Snyk CLI
        run: npm install -g snyk
      - name: Run Snyk SAST (Frontend)
        working-directory: ./frontend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test --json > snyk-sast.json || true
          node ../scripts/snyk-score.js snyk-sast.json

  sca_scan:
    needs: [changes, sast_scan]
    if: |
      always() && 
      needs.changes.outputs.services != '["none"]' &&
      (needs.sast_scan.result == 'success' || needs.sast_scan.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Dependencies
        working-directory: ./microservices/${{ matrix.service }}
        run: npm install
      - name: Install Snyk CLI
        run: npm install -g snyk
      - name: Run Snyk SCA
        working-directory: ./microservices/${{ matrix.service }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --json > snyk-sca.json || true
          node ../../scripts/snyk-score.js snyk-sca.json

  sca_scan_frontend:
    needs: [changes, sast_scan_frontend]
    if: |
      always() && 
      needs.changes.outputs.frontend == 'true' &&
      (needs.sast_scan_frontend.result == 'success' || needs.sast_scan_frontend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install
      - name: Install Snyk CLI
        run: npm install -g snyk
      - name: Run Snyk SCA (Frontend)
        working-directory: ./frontend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --json > snyk-sca.json || true
          node ../scripts/snyk-score.js snyk-sca.json

  deploy:
    needs: [changes, sca_scan]
    if: |
      always() && 
      needs.changes.outputs.services != '["none"]' &&
      (needs.sca_scan.result == 'success' || needs.sca_scan.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Dependencies
        working-directory: ./microservices/${{ matrix.service }}
        run: npm install
      - name: Zip Microservice
        working-directory: ./microservices/${{ matrix.service }}
        run: zip -r ../${{ matrix.service }}.zip .
      - name: Deploy to AWS Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          case "${{ matrix.service }}" in
            cart_service) FN="raveen-cart_service" ;;
            order_service) FN="raveen-order_service" ;;
            payment_service) FN="raveen-payment_service" ;;
            product_service) FN="raveen-product_service" ;;
            Inventory_service) FN="Inventory_consumer-raveen" ;;
            Notification_service) FN="email-consumer-raveen" ;;
            *) FN="raveen-${{ matrix.service }}" ;;
          esac
          
          aws lambda update-function-code \
            --function-name $FN \
            --zip-file fileb://microservices/${{ matrix.service }}.zip

  deploy_frontend:
    needs: [changes, deploy, sca_scan_frontend]
    if: |
      always() && 
      needs.changes.outputs.frontend == 'true' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped' || needs.deploy.result == 'true') &&
      (needs.sca_scan_frontend.result == 'success' || needs.sca_scan_frontend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 sync frontend/build/ s3://raveen-ecommerce --delete
